name: PODIUM LIVE Collector

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "SofaScore event ID"
        required: true
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python collector.py "${{ inputs.event_id }}"

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sofascore-snapshot-${{ inputs.event_id }}
          path: data/*.json
